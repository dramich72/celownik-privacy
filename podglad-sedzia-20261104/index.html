const d=defs.find(x=>x.id===route);document.title=`CEL-ownik · ${d?d.title:'Wszystkie ekrany'} · makieta`;
document.getElementById('heading').innerHTML=d?`<div class="row meta wrap"><span class="eyebrow">Ekran ${d.n} / 24 · ${d.group}</span>${badge(d.status)}</div><h1>${d.title}</h1><p>${d.desc}</p>`:'';
let content;if(!d)content=overview();else if(mobileIds.has(route)){const n=roleNotes[route]||['Spójny przebieg w telefonie',d.desc,['Duże pola i czytelny stan zapisu.','Jedna główna akcja na ekranie.','Dane demonstracyjne — nic nie jest wysyłane.']];content=`<div class="phone-layout">${body(route)}<aside class="flow-note"><p class="eyebrow">Założenie ekranu</p><h3>${n[0]}</h3><p>${n[1]}</p>${route==='timed'?`<div class="stack g8"><p>Podgląd konfiguracji (poza ekranem sędziego):</p><div class="seg"><button class="${!timedParameters?'on':''}" data-action="time-only">Sam czas</button><button class="${timedParameters?'on':''}" data-action="time-targets">Czas + cele</button></div></div>`:''}${route==='violation'?'<div class="notice warn">Kara +2 s jest wyłącznie regułą fikcyjnej próby DEMO. Nie pochodzi z regulaminu SP5/C ani TenClub.</div>':''}<ul>${n[2].map(x=>`<li>${x}</li>`).join('')}</ul><div class="rule"></div><p>Makieta interaktywna. Przyciski przechodzą między ekranami lub symulują zachowanie. Brak połączenia z prawdziwymi zawodami.</p><div class="row wrap">${go('overview','Wszystkie ekrany','compact')}${go('registration','Zacznij od zapisu','compact')}</div></aside></div>`;}else content=body(route);
document.getElementById('content').innerHTML=content;
document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.go===route));
if(d){const i=defs.indexOf(d);document.getElementById('pager').innerHTML=`${go(i?defs[i-1].id:'overview','← '+(i?defs[i-1].title:'Wszystkie ekrany'),'ghost')}${go(i<defs.length-1?defs[i+1].id:'overview',(i<defs.length-1?defs[i+1].title:'Wszystkie ekrany')+' →','ghost')}`;}else document.getElementById('pager').innerHTML='';
if(d)document.getElementById('content').insertAdjacentHTML('beforeend','<p class="screen-preview-note">Wizualizacja projektowa · dane DEMO · zachowuje istniejącą paletę CEL-ownika i sędziowski akcent pomarańczowy. Nie jest zrzutem z wydanej aplikacji.</p>');
document.querySelectorAll('.draft-name').forEach(el=>el.textContent=draftName);
}
function navigate(id){document.getElementById('toast').classList.add('hidden');if(id==='audit')id='setup';if(!defs.some(d=>d.id===id)&&id!=='overview')id='overview';route=id;location.hash=id;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('sidebar').classList.remove('open');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4800);}
function parseTime(s){if(!/^\d{1,4}([,.]\d{1,2})?$/.test(s.trim()))return null;const n=Number(s.replace(',','.'));return n>0&&n<=9999.99?n:null;}
function updateSelection(){document.getElementById('selection-summary').innerHTML=selectedCourses.map(c=>`<div class="row between"><strong>${c}</strong><span class="small muted">Podejście 1</span></div>`).join('');document.querySelector('.side-summary .stat strong').textContent=selectedCourses.length;}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){e.preventDefault();navigate(nav.dataset.go);return;}const filter=e.target.closest('[data-filter]');if(filter){document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b===filter));document.querySelectorAll('.screen-tile').forEach(el=>el.classList.toggle('hidden',filter.dataset.filter!=='all'&&el.dataset.kind!==filter.dataset.filter));return;}const actionEl=e.target.closest('[data-action]');if(!actionEl)return;const a=actionEl.dataset.action;
if(a==='register'){const name=document.getElementById('reg-name').value.trim(),number=document.getElementById('reg-number').value.trim(),missing=selectedCourses.find(c=>!document.querySelector(`[data-weapon="${c}"]`).value);if(!name||!number||!selectedCourses.length||missing){document.getElementById('reg-error').textContent=missing?'Wybierz broń dla '+missing+'.':'Uzupełnij dane i wybierz przynajmniej jedną konkurencję.';return;}draftName=name;draftNumber=number;document.querySelectorAll('[data-weapon]').forEach(el=>weapons[el.dataset.weapon]=el.value);navigate('labels');toast('Makieta: potwierdzono wybrane starty i przygotowano komplet. Nie zapisano danych na serwerze.');}
else if(a==='target-confirm'){targetPenalty=Number(document.getElementById('penalty-input')?.value||0);if(!Number.isSafeInteger(targetPenalty)||targetPenalty<0||targetPenalty>10000){toast('Kara musi być dodatnią liczbą całkowitą lub zerem.');return;}isTime=false;checked=false;navigate('confirm');}
else if(a==='time-confirm'){timeText=document.getElementById('time-input').value;if(parseTime(timeText)===null){toast('Wpisz dodatni czas w sekundach, np. 24,37. Maksymalnie dwa miejsca po przecinku w tym przykładzie.');return;}timeText=parseTime(timeText).toFixed(2).replace('.',',');if(timedParameters&&(!/^\d+$/.test(timedHits)||Number(timedHits)>5)){toast('Liczba trafionych celów musi być od 0 do 5 w tym przykładzie.');return;}if(hasViolation&&violationKind==='other'){toast('Najpierw wyjaśnij naruszenie z kierownikiem albo usuń je po sprawdzeniu.');return;}isTime=true;checked=false;navigate('confirm');}
else if(a==='approve'){if(!document.getElementById('confirm-check').checked){document.getElementById('confirm-error').textContent='Potwierdź sprawdzenie zawodnika, konkurencji i wyniku.';return;}uploadOffline=false;navigate('queue');toast('Makieta: zatwierdzenie i dostarczenie wyniku. Brak prawdziwego zapisu.');}
else if(a==='save-violation'){const text=document.getElementById('violation-description').value.trim();if(violationKind==='other'&&!text){document.getElementById('violation-error').textContent='Opisz naruszenie, które wymaga wyjaśnienia.';return;}violationText=text;hasViolation=true;if(violationKind==='configured'){navigate('timed');toast('Makieta: dodano przykładową karę DEMO +2 s. Nie jest to stawka z regulaminu TenClub.');}else toast('Makieta: szkic zachowany do wyjaśnienia. Wynik nie został opublikowany.');}
else if(a==='time-only'||a==='time-targets'){timedParameters=a==='time-targets';render();}
else if(a==='clear-violation'){hasViolation=false;violationText='';violationKind='other';navigate('timed');}
else if(a==='offline'){uploadOffline=!uploadOffline;render();}
else if(a==='return'){const val=document.getElementById('return-reason').value.trim();if(!val){document.getElementById('return-error').textContent='Podaj konkretny powód zwrotu.';return;}navigate('manager-mobile');toast('Makieta: ocena zwrócona sędziemu z uzasadnieniem.');}
else if(a==='history')document.getElementById('history-box').classList.toggle('hidden');
else if(a==='rank-time'||a==='rank-points'){actionEl.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===actionEl));document.getElementById('rank-list').innerHTML=rankMobile(a==='rank-time');}
else if(a==='course-time'||a==='course-points'){actionEl.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===actionEl));document.getElementById('point-config').classList.toggle('hidden',a==='course-time');document.getElementById('time-config').classList.toggle('hidden',a==='course-points');}
else if(a==='toggle-marks'||a==='photo-original'||a==='photo-assessed'){document.querySelectorAll('#content>.phone-layout .score-mark').forEach(m=>m.classList.toggle('hidden',a==='photo-original'||a==='toggle-marks'&&!m.classList.contains('hidden')));if(a!=='toggle-marks')actionEl.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===actionEl));}
else if(a==='tv-next'){tvPage=1-tvPage;render();}
else if(a==='tv-auto'){if(tvTimer){clearInterval(tvTimer);tvTimer=null;}else{tvTimer=setInterval(()=>{if(route==='tv'){tvPage=1-tvPage;render();}},8000);}render();}
else if(a==='print-demo'){toast('Makieta etykiet DEMO. Format rzeczywistej drukarki ustalimy po jej podłączeniu.');window.print();}
else if(a==='edit-hits')toast('W istniejącej aplikacji: dodaj, usuń, przesuń trafienie i zmień jego punkty. Tu pokazujemy układ ekranu.');
else if(a==='scan-demo')toast('Makieta: odczytano start Anny Demo · Pcz10. Aparat nie jest uruchamiany.');
else if(a==='manager-approve')toast('Makieta: kontrola potwierdzona. Wynik był widoczny już po dostarczeniu przez sędziego.');
else if(a==='publish')toast('Makieta: publikacja wymaga świadomej decyzji. Prawdziwe ustawienia nie zostały zmienione.');
else if(a==='dq')toast('Obecny panel umożliwia dyskwalifikację w wybranej konkurencji oraz jej cofnięcie. Makieta nie zmienia wyników.');
else if(a==='draft')toast('Makieta: szkic wyniku czasowego. Ten nowy typ danych wymaga wdrożenia.');
else toast('To wizualizacja. Operacja nie jest wykonywana na prawdziwych zawodach.');
});
document.addEventListener('change',e=>{if(e.target.id==='violation-type'){violationKind=e.target.value;render();}if(e.target.dataset.weapon)weapons[e.target.dataset.weapon]=e.target.value;if(e.target.dataset.course){selectedCourses=[...document.querySelectorAll('[data-course]:checked')].map(x=>x.dataset.course);updateSelection();}if(e.target.id==='confirm-check')checked=e.target.checked;});
document.addEventListener('input',e=>{if(e.target.id==='time-hits')timedHits=e.target.value;if(e.target.id==='time-input')timeText=e.target.value;if(e.target.id==='penalty-input'){const p=Number(e.target.value);document.getElementById('points-total').textContent=Number.isSafeInteger(p)&&p>=0&&p<=10000?(92-p)+' pkt':'Sprawdź karę';}if(e.target.id==='reg-name'){document.querySelectorAll('.draft-name').forEach(x=>x.textContent=e.target.value||'Nowy zawodnik');}if(e.target.id==='violation-description')violationText=e.target.value;});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('screen-tile')){e.preventDefault();navigate(e.target.dataset.go);}});
document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
let previousGroup='';document.getElementById('sidebar').innerHTML=`<button class="nav-item" data-go="overview"><span class="idx">⌘</span>Wszystkie ekrany</button>`+defs.map(d=>{const label=d.group!==previousGroup?`<p class="group">${d.group}</p>`:'';previousGroup=d.group;return label+`<button class="nav-item" data-go="${d.id}"><span class="idx">${d.n}</span>${d.title}${d.status==='new'?'<span class="nav-state">+</span>':''}</button>`;}).join('');
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==route){route=defs.some(d=>d.id===id)?id:'overview';render();}});route=location.hash.slice(1)||'overview';if(!defs.some(d=>d.id===route))route='overview';render();

})();
</script>
</body></html>
